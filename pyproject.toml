[project]
name = "gsn-segment"
version = "0.1.0"
description = "Segmentation of the greater sciatic notch (GSN) from 2D images"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "customtkinter>=5.2.2,<6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-shutil>=1.8.1,<2.0",
]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64"]

[tool.pixi.dependencies]
python = "3.12.*"
opencv = ">=4.10"
numpy = ">=2.0,<3.0"
scikit-image = ">=0.25"
matplotlib = ">=3.9"
pandas = ">=2.2"
scikit-learn = ">=1.6"
seaborn = ">=0.13"
joblib = ">=1.4"
papermill = ">=2.6"
pyyaml = ">=6.0"

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }

[tool.pixi.tasks]
start = "python main.py"
test = "pytest"
